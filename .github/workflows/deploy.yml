# Test, then deploy to the EC2 VM with Docker (docker-compose.prod.yml).
# Runs on every push to dev, or by hand from the Actions tab.
#
# Repository secrets (Settings -> Secrets and variables -> Actions):
#   EC2_HOST     Elastic IP of the VM, e.g. 13.204.151.164
#   EC2_USER     ec2-user (Amazon Linux)
#   EC2_SSH_KEY  full contents of the .pem key pair file
#   ENV_FILE     full contents of the production .env (DB password, AWS keys, S3 bucket ...)
name: Test and deploy

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Backend unit tests
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend type check, tests and build
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      APP_DIR: /opt/rfp-contract-evaluation
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload the release and .env
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          git archive --format=tar.gz -o release.tgz HEAD
          umask 077 && printf '%s\n' "$ENV_FILE" > app.env
          scp -i ~/.ssh/ec2.pem release.tgz app.env "$EC2_USER@$EC2_HOST:/tmp/"
          rm -f app.env

      - name: Deploy on the VM
        run: |
          ssh -i ~/.ssh/ec2.pem "$EC2_USER@$EC2_HOST" "APP_DIR=$APP_DIR bash -s" <<'REMOTE'
          set -euo pipefail
          sudo mkdir -p "$APP_DIR" && sudo chown "$USER" "$APP_DIR"
          cd "$APP_DIR"
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          tar xzf /tmp/release.tgz
          install -m 600 /tmp/app.env .env
          rm -f /tmp/release.tgz /tmp/app.env
          bash deploy/remote-deploy.sh
          REMOTE

      - name: Remove the SSH key
        if: always()
        run: rm -f ~/.ssh/ec2.pem
