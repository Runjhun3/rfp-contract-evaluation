# Serves the built React app and forwards /api to the Python API container.
server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    # Bid PDFs can be up to 150 MB.
    client_max_body_size 160m;

    # The API sets its own security headers; nginx only passes requests through.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Hashed build files never change, so browsers may keep them.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Every other path is a React route: always answer with index.html.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
