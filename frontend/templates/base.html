<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Bid Evaluation{% endblock %} · Bid Evaluation</title>
<link rel="stylesheet" href="/static/app.css">
<script src="/static/app.js" defer></script>
</head>
<body>
<header class="topbar">
  <a class="brand" href="/projects">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 4h12l4 4v12H4z"></path><path d="M8 12l3 3 5-6"></path></svg>
    <strong>Bid Evaluation</strong>
  </a>
  {% if user %}
  <div class="who">
    <span>{{ user.full_name }} · {{ user.role|title }}</span>
    <form method="post" action="/logout"><input type="hidden" name="csrf" value="{{ csrf }}"><button type="submit">Sign out</button></form>
  </div>
  {% endif %}
</header>
{% block body %}{% endblock %}
<footer class="site">Marks shown here are recommendations. The Tender Evaluation Committee reviews every flagged item and signs the final sheet.</footer>
</body>
</html>
